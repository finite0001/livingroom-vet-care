[functions.dispatch-outbox]
verify_jwt = false

[functions.dispatch-outbound-deliveries]
verify_jwt = false

[functions.queue-reminders]
verify_jwt = false

# Public liveness probe for an uptime monitor, which holds no credential. The
# handler reports only whether the database answered and when it was asked: it
# never returns an error text, a version or a count. See
# _shared/health-ping.ts. The scheduler's real health is visible to administrators
# on /hub/admin/operations instead.
[functions.health]
verify_jwt = false

[functions.public-contact]
verify_jwt = false

[functions.resend-delivery-webhook]
verify_jwt = false

[functions.twilio-message-status-callback]
verify_jwt = false

[functions.twilio-inbound-sms]
