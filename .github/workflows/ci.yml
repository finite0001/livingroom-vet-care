name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-production-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
          cache: true
      - name: Check all Edge Function entry points with the committed dependency lock
        run: deno check --frozen supabase/functions/*/index.ts
      - name: Verify invoice handler without root Node dependencies
        run: python3 scripts/verify-invoice-edge-isolation.py

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - run: supabase start --exclude realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
      - name: Verify concurrent treatment alert snapshot locks
        run: python3 tests/clinical/verify-alert-locks.py --project-config supabase/config.toml
      - name: Verify concurrent payment collection and invoice locks
        run: python3 supabase/tests/payment_collection_concurrency.py --project-config supabase/config.toml
      - name: Verify concurrent reconciliation and financial evidence
        run: python3 supabase/tests/payment_reconciliation_concurrency.py --project-config supabase/config.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
          cache: true
      - name: Check and cache payment HTTP roundtrip dependencies
        run: deno check --frozen tests/payment-access/local-server.ts
      - name: Verify actual payment capability HTTP and ledger roundtrip
        run: node --experimental-strip-types tests/payment-access/local-roundtrip.ts
        env:
          PAYMENT_TEST_PROJECT: ${{ github.workspace }}
      - name: Check and cache payment delivery HTTP dependencies
        run: deno check --frozen tests/payment-access/delivery-local-server.ts
      - name: Verify actual payment delivery HTTP, queue and worker roundtrip
        run: node --experimental-strip-types tests/payment-access/delivery-local-roundtrip.ts
        env:
          PAYMENT_TEST_PROJECT: ${{ github.workspace }}
      - name: Verify actual private Storage round-trip
        run: node scripts/verify-local-storage.mjs
        env:
          RUN_ISOLATED_STORAGE_TEST: '1'
