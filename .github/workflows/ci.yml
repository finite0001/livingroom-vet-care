name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-production-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check read-only schema comparison safeguards
        run: python3 -B -m unittest discover -s scripts/restore-rehearsal -p 'test_*.py'
      - name: Verify restore privilege diagnostics and original Storage metadata
        run: |
          python3 -B -m unittest discover -s tests/restore -p 'test_*.py'
          node --test tests/restore/storage-metadata.test.mjs
      - name: Verify offline synthetic recap evaluation safeguards
        run: python3 -B -m unittest discover -s tests/clinical-recap -p 'test_*.py'
      - name: Verify offline synthetic call transport safeguards
        run: python3 -B -m unittest discover -s tests/clinical-calls -p 'test_synthetic_provider*.py'
      - name: Verify retained backend proof bytes without executing archived code
        run: |
          python3 -I -B evidence/controlled-record-review/backend-workflow-proofs-v1/verify.py
          python3 -I -B evidence/controlled-record-review/backend-workflow-proofs-v1/test_verifier.py
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Verify built local barcode worker and simulated camera cleanup
        run: node tests/inventory/scanner-browser.mjs
        env:
          SCANNER_RUN_SYNTHETIC_LOCAL: "true"
      - run: npm run test:e2e

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
          cache: true
      - name: Check all Edge Function entry points with the committed dependency lock
        run: >-
          deno check --frozen supabase/functions/*/index.ts
          supabase/functions/ezyvet-import/attachment-metadata.ts
          supabase/functions/_shared/clinical-call-note-model.ts
          supabase/functions/_shared/clinical-call-note-provider.ts
          supabase/functions/_shared/clinical-call-note-processing-model.ts
      - name: Verify invoice handler without root Node dependencies
        run: python3 scripts/verify-invoice-edge-isolation.py
      - name: Verify every diagnostic-record consumer without root Node dependencies
        run: python3 scripts/verify-record-edge-isolation.py
      - name: Verify patient photo handler without root Node dependencies
        run: python3 scripts/verify-patient-photo-edge-isolation.py
      - name: Verify diagnostic PDF handler without root Node dependencies
        run: python3 scripts/verify-diagnostic-pdf-edge-isolation.py
      - name: Verify reconciliation worker without root Node dependencies
        run: python3 scripts/verify-operational-reconciliation-edge-isolation.py
      - name: Verify unpaid invoice reminder worker without root Node dependencies
        run: python3 scripts/verify-invoice-reminder-edge-isolation.py
      - name: Verify clinical audio handler without root Node dependencies
        run: python3 scripts/verify-clinical-audio-edge-isolation.py

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify local concurrency harness regressions
        run: python3 -B -m unittest discover -s supabase/tests -p 'test_*_harness.py'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Verify scheduler interference refusal and paused canonical installation
        run: python3 -B scripts/ci-owned-bootstrap-evidence.py --stage timer_probe
      - name: Retain encrypted scheduler proof diagnostics
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owned-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}-timer_probe
          path: |
            ${{ runner.temp }}/lrv-owned-bootstrap-upload-timer_probe/evidence.cms
            ${{ runner.temp }}/lrv-owned-bootstrap-upload-timer_probe/public-status.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Start owned canonical database with scheduler paused before migrations
        run: python3 -B scripts/ci-owned-bootstrap-evidence.py --stage central_bootstrap
      - name: Retain encrypted central database diagnostics
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owned-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}-central_bootstrap
          path: |
            ${{ runner.temp }}/lrv-owned-bootstrap-upload-central_bootstrap/evidence.cms
            ${{ runner.temp }}/lrv-owned-bootstrap-upload-central_bootstrap/public-status.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - run: supabase test db
      - name: Verify diagnostic PDF job contention and captured-byte restore
        run: python3 -B supabase/tests/diagnostic_pdf_jobs_concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify diagnostic review and correction contention
        run: python3 -B supabase/tests/manual_diagnostics_concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify recurring care review, completion and final delivery eligibility races
        run: python3 -B supabase/tests/care_plan_recurrence_concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify concurrent service completion, correction and patient archival
        run: python3 -B supabase/tests/whogot_concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify photo choice, replay and verified-byte deletion concurrency
        run: python3 -B supabase/tests/patient_photos_concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify unknown inbound retry after concurrent complete-household creation
        run: python3 -B supabase/tests/client_inbound_concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify native prescription cancellation and replacement concurrency
        run: python3 -B supabase/tests/native_prescriptions_concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify native refill operational transitions and linked-order concurrency
        run: python3 -B supabase/tests/native_refills_concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify product and lot ordering with queued catalog updates
        run: python3 -B supabase/tests/inventory_product_locking_concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify native dispensing allowance, stock and invoice concurrency
        run: python3 -B supabase/tests/native_fulfillment_concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify native record-release source concurrency
        run: python3 -B supabase/tests/native_record_releases_concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify native dispense correction and release concurrency
        run: python3 -B supabase/tests/native_dispense_corrections_concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify native physical return custody and inventory concurrency
        run: python3 -B supabase/tests/native_dispense_returns_concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify native return compensation and discrepancy hold concurrency
        run: python3 -B tests/prescriptions/native_reconciliation_concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify native dispense credits and refund reservation concurrency
        run: python3 -B tests/prescriptions/native_finance_concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify native estimate drafts, catalog review and uncertain-save resolution
        run: python3 -B tests/estimates/draft-concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify abandoned attachment cleanup claims, replacement and receipt races
        run: python3 supabase/tests/abandoned_attachment_cleanup_concurrency.py --project-config supabase/config.toml --run-synthetic-local
      - name: Verify incoming attachment claim, finalization and revocation races
        run: python3 supabase/tests/inbound_attachment_concurrency.py --project-config supabase/config.toml --run-synthetic-local
      - name: Verify conversation attachment capture and queue races
        run: python3 supabase/tests/conversation_email_concurrency.py --project-config supabase/config.toml --run-synthetic-local
      - name: Verify native estimate publication capture, lifecycle and uncertain-save resolution
        run: python3 -B tests/estimates/publication-concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify concurrent treatment alert snapshot locks
        run: python3 tests/clinical/verify-alert-locks.py --project-config supabase/config.toml
      - name: Verify concurrent payment collection and invoice locks
        run: python3 supabase/tests/payment_collection_concurrency.py --project-config supabase/config.toml
      - name: Verify concurrent reconciliation and financial evidence
        run: python3 supabase/tests/payment_reconciliation_concurrency.py --project-config supabase/config.toml
      - name: Verify concurrent reviewed payment delivery guards
        run: python3 supabase/tests/payment_delivery_concurrency.py --project-config supabase/config.toml
      - name: Verify audited payment event retry concurrency
        run: python3 supabase/tests/stripe_event_retry_concurrency.py --project-config supabase/config.toml
      - name: Verify concurrent lab report promotion and document guards
        run: python3 supabase/tests/lab_result_provenance_concurrency.py --project-config supabase/config.toml
      - name: Verify concurrent external record approval and correction guards
        run: python3 supabase/tests/external_record_provenance_concurrency.py --project-config supabase/config.toml
      - name: Verify concurrent inbound processing retry and lease guards
        run: python3 supabase/tests/inbound_processing_recovery_concurrency.py --project-config supabase/config.toml
      - name: Verify operational discovery and scheduler run concurrency
        run: python3 supabase/tests/operations_visibility_concurrency.py --project-config supabase/config.toml
      - name: Verify records request capture and cancellation concurrency
        run: python3 supabase/tests/record_requests_concurrency.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify reviewed outgoing retry receipt and stale-work concurrency
        run: python3 supabase/tests/outbox_retry_concurrency.py --project-config supabase/config.toml
      - name: Reproduce and correct explicit RPC grant drift
        run: python3 supabase/tests/explicit_rpc_grants_upgrade.py --project-config supabase/config.toml
      - name: Verify selected-source release locking and invalidation
        run: python3 supabase/tests/release_source_provenance_concurrency.py --project-config supabase/config.toml
      - name: Verify patient-scoped clinical import leases and observation versions
        run: python3 supabase/tests/ezyvet_clinical_runs_concurrency.py --project-config supabase/config.toml
      - name: Verify consult-scoped vaccination import races
        run: python3 supabase/tests/ezyvet_vaccination_runs_concurrency.py --project-config supabase/config.toml
      - name: Verify prescription parent and item import races
        run: python3 supabase/tests/ezyvet_prescriptionitem_runs_concurrency.py --project-config supabase/config.toml
      - name: Verify reviewed vaccination approval and correction races
        run: python3 supabase/tests/ezyvet_vaccination_review_concurrency.py --project-config supabase/config.toml
      - name: Verify reviewed prescription approval and correction races
        run: python3 supabase/tests/ezyvet_prescription_review_concurrency.py --project-config supabase/config.toml
      - name: Verify attachment metadata leases, parent locks and replay races
        run: python3 supabase/tests/ezyvet_attachment_metadata_concurrency.py --project-config supabase/config.toml --run-synthetic-local
      - name: Verify original capture, source leases and fenced Storage races
        run: python3 supabase/tests/ezyvet_attachment_originals_concurrency.py --project-config supabase/config.toml --run-synthetic-local
      - name: Verify populated additive prescription reference upgrade
        run: python3 supabase/tests/prescription_reference_upgrade.py --project-config supabase/config.toml
      - name: Verify reviewed history, local problem and release concurrency
        run: python3 supabase/tests/ezyvet_history_provenance_concurrency.py --project-config supabase/config.toml
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install browser for native full-stack acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify native prescribing, real browser dispensing and populated restore
        run: python3 -B tests/prescriptions/native-disposable.py --run-synthetic-local
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
          cache: true
      - name: Check and cache payment HTTP roundtrip dependencies
        run: deno check --frozen tests/payment-access/local-server.ts
      - name: Verify actual payment capability HTTP and ledger roundtrip
        run: node --experimental-strip-types tests/payment-access/local-roundtrip.ts
        env:
          PAYMENT_TEST_PROJECT: ${{ github.workspace }}
      - name: Check and cache reconciliation HTTP roundtrip dependencies
        run: deno check --frozen tests/payment-reconciliation/local-server.ts
      - name: Verify actual administrator reconciliation HTTP and proof capture
        run: node --experimental-strip-types tests/payment-reconciliation/local-roundtrip.ts
        env:
          PAYMENT_TEST_PROJECT: ${{ github.workspace }}
      - name: Check and cache payment delivery HTTP dependencies
        run: deno check --frozen tests/payment-access/delivery-local-server.ts
      - name: Verify actual payment delivery HTTP, queue and worker roundtrip
        run: node --experimental-strip-types tests/payment-access/delivery-local-roundtrip.ts
        env:
          PAYMENT_TEST_PROJECT: ${{ github.workspace }}
      - name: Verify actual clinical booking, treatment, billing and release workflow
        run: node --experimental-strip-types tests/clinical/local-workflow.ts
        env:
          PAYMENT_TEST_PROJECT: ${{ github.workspace }}
      - name: Compare PostgreSQL and TypeScript return quantity replay
        run: python3 -B tests/prescriptions/return-replay-parity.py --run-synthetic-local --project-config supabase/config.toml
      - name: Verify actual scheduler run receipts and operational discovery
        run: node --experimental-strip-types tests/operations/local-roundtrip.ts
        env:
          PAYMENT_TEST_PROJECT: ${{ github.workspace }}
      - name: Verify actual reviewed outbox retry receipts and original delivery guards
        run: node --experimental-strip-types tests/outbox-retry/local-roundtrip.ts
        env:
          PAYMENT_TEST_PROJECT: ${{ github.workspace }}
      - name: Verify actual private Storage round-trip
        run: node scripts/verify-local-storage.mjs
        env:
          RUN_ISOLATED_STORAGE_TEST: '1'
      - name: Check and cache private lab report HTTP dependencies
        run: deno check --frozen tests/lab-reports/local-server.ts
      - name: Verify actual lab report HTTP and private Storage byte capture
        run: node --experimental-strip-types tests/lab-reports/local-roundtrip.ts
        env:
          PAYMENT_TEST_PROJECT: ${{ github.workspace }}
      - name: Verify signed inbound receipt and actual staff inbox workflow
        run: node --experimental-strip-types tests/inbound/local-roundtrip.ts
        env:
          PAYMENT_TEST_PROJECT: ${{ github.workspace }}
      - name: Verify signed SMS consent ordering and inbox persistence
        run: node --experimental-strip-types tests/inbound/sms-local-roundtrip.ts
        env:
          PAYMENT_TEST_PROJECT: ${{ github.workspace }}
      - name: Check and cache external record HTTP dependencies
        run: deno check --frozen tests/external-records/local-server.ts
      - name: Verify actual external record HTTP and private file capture
        run: node --experimental-strip-types tests/external-records/local-roundtrip.ts
        env:
          PAYMENT_TEST_PROJECT: ${{ github.workspace }}
      - name: Verify patient-scoped clinical imports through actual HTTP and Auth
        run: node --experimental-strip-types tests/ezyvet/clinical-local-roundtrip.ts
        env:
          PAYMENT_TEST_PROJECT: ${{ github.workspace }}
      - name: Verify consult-scoped vaccination imports through actual HTTP and Auth
        run: node --experimental-strip-types tests/ezyvet/vaccination-local-roundtrip.ts
        env:
          PAYMENT_TEST_PROJECT: ${{ github.workspace }}
      - name: Verify prescription intake and clinical review through actual HTTP and Auth
        run: node --experimental-strip-types tests/ezyvet/prescription-local-roundtrip.ts
        env:
          PAYMENT_TEST_PROJECT: ${{ github.workspace }}
      - name: Verify unpaid invoice reminders through local Auth, browser, contention and populated restore
        run: python3 -B tests/invoice-reminders/disposable.py --run-synthetic-local
      - name: Verify source-bound dictation review through real Auth, browser, competing edits and populated restore
        run: python3 -B tests/clinical-dictation/disposable.py --run-synthetic-local
      - name: Verify audio capture, one-shot provider dispatch, recovery and reviewed SOAP in an owned runtime
        run: python3 -B tests/clinical-audio/disposable.py --run-synthetic-local
      - name: Verify template note generation, source recovery, revoked-session locks and populated restore
        run: python3 -B tests/clinical-notes/disposable.py --run-synthetic-local
      - name: Verify source-cited recap, source-write races and immutable review in an owned runtime
        run: python3 -B tests/clinical-recap/disposable.py --run-synthetic-local
      - name: Verify private call-source capture through Auth, HTTP and populated restore
        run: python3 -B tests/clinical-calls/disposable.py --run-synthetic-local
      - name: Verify private call-note access, legacy frontend compatibility and populated restore
        run: python3 -B tests/clinical-call-notes/disposable.py --run-synthetic-local
      - name: Verify guarded call drafts, private review, Auth races and populated restore
        run: python3 -B tests/clinical-call-generation/disposable.py --run-synthetic-local
      - name: Verify source-bound release artifacts in disposable Auth and Storage
        run: python3 tests/record-releases/source-disposable.py --run-synthetic-local
      - name: Verify reviewed imported history and release artifacts in disposable Auth and Storage
        run: python3 tests/record-releases/source-disposable.py --run-synthetic-local --fixture clinical-history
      - name: Verify attachment metadata and original capture through disposable Auth and Storage
        run: python3 tests/ezyvet/attachment-metadata-disposable.py --run-synthetic-local --fixture all
      - name: Verify conversation upload ownership and actual private bytes
        run: node --experimental-strip-types tests/communications/upload-local-roundtrip.ts
        env:
          PAYMENT_TEST_PROJECT: ${{ github.workspace }}
      - name: Verify incoming attachment HTTP capture and reads through actual Auth and private Storage
        run: node --experimental-strip-types tests/inbound/attachment-local-roundtrip.ts
        env:
          PAYMENT_TEST_PROJECT: ${{ github.workspace }}
      - name: Verify patient photo ownership and actual private image bytes
        run: node --experimental-strip-types tests/patient-photos/local-roundtrip.ts
        env:
          PHOTO_TEST_PROJECT: ${{ github.workspace }}
      - name: Verify Whogot and performed services through actual local Auth and PostgREST
        run: node --experimental-strip-types tests/whogot/local-roundtrip.ts
        env:
          WHOGOT_TEST_PROJECT: ${{ github.workspace }}
      - name: Verify daily communications through actual local Auth and PostgREST
        run: node --experimental-strip-types tests/daily-communications/local-roundtrip.ts
        env:
          DAILY_TEST_PROJECT: ${{ github.workspace }}
      - name: Verify recurring care through actual local Auth and PostgREST
        run: node --experimental-strip-types tests/care-plans/local-roundtrip.ts
        env:
          CARE_TEST_PROJECT: ${{ github.workspace }}
          CARE_RUN_SYNTHETIC_LOCAL: "true"
      - name: Verify records requests through actual Auth, Storage and reviewed email queue
        run: node --experimental-strip-types tests/records-requests/local-roundtrip.ts
        env:
          RECORDS_TEST_PROJECT: ${{ github.workspace }}
          RECORDS_RUN_SYNTHETIC_LOCAL: "true"
      - name: Verify diagnostic Auth, private originals and real Patient 360 in an owned runtime
        run: python3 -B tests/diagnostics/local-disposable.py --run-synthetic-local
      - name: Verify diagnostic PDF jobs, exact-byte recovery and Patient360 in an owned runtime
        run: python3 -B tests/diagnostics/pdf-jobs-disposable.py --run-synthetic-local

  controlled-stock:
    # Run only the owned rehearsal stacks, without the database job's foundation.
    # Existing probe deadlines, reserves, workloads and cleanup gates remain unchanged.
    # Secondary review declares its own workload bound and cleanup reserve.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Verify frozen private controlled-stock installation artifact
        run: python3 -B tests/controlled-drugs/engine/candidate/release_assembly.py --check
      - name: Verify CLI-owned controlled-stock migration body
        run: python3 -B tests/controlled-drugs/engine/candidate/cli_migration_body.py --check
      - name: Verify independently sealed private secondary-review installation artifacts
        run: |
          python3 -B tests/controlled-drugs/engine/candidate/secondary_review_release.py --check
          python3 -B tests/controlled-drugs/engine/candidate/secondary_review_cli_body.py --check
      - name: Verify canonical 206 reference, CLI atomicity and private attachment restores
        run: python3 -B tests/controlled-drugs/engine/candidate/run-secondary-review-cli-atomicity.py --run-synthetic-local --acceptance
      - name: Verify isolated controlled-stock candidate, ordinary compatibility, real Auth waits and managed restore
        run: python3 -B tests/controlled-drugs/engine/candidate/run-local.py --run-synthetic-local --use-canonical-migration --include-sql-regression --include-correction-capacity --include-correction-restore
      - name: Verify genuine 187/188 history, available-only openings and populated opening restore
        run: python3 -B tests/controlled-drugs/engine/candidate/run-native-history.py --run-synthetic-local --use-canonical-migration
      - name: Verify actual CLI ledger failure rollback and transaction barrier
        run: python3 -B tests/controlled-drugs/engine/candidate/run-cli-atomicity.py --run-synthetic-local
      - name: Verify separately sealed secondary-review admission and transaction feasibility
        run: python3 -B tests/controlled-drugs/engine/candidate/probe-secondary-review.py --run-synthetic-local --gate-a
      - name: Verify private secondary review through real Auth, natural expiry and populated restore
        run: python3 -B tests/controlled-drugs/engine/candidate/probe-secondary-review-protocol.py --run-synthetic-local --acceptance

  diagnostic-renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium with bounded APT retries
        run: |
          apt_config=/etc/apt/apt.conf.d/99lrv-renderer-network
          test ! -e "$apt_config"
          trap 'sudo rm -f "$apt_config"' EXIT
          printf '%s\n' \
            'Acquire::Retries "5";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' |
            sudo tee "$apt_config" >/dev/null
          npx playwright install --with-deps chromium
      - run: node --experimental-strip-types scripts/diagnostics/generate-synthetic-input.ts
      - name: Build pinned native amd64 renderer
        run: docker build --platform linux/amd64 -t lrv-diagnostic-renderer:20261011 services/diagnostic-renderer
      - name: Prove restricted Chromium, actual PDF admission and whole-container cleanup
        run: python3 -B tests/diagnostics/renderer_local.py --run-synthetic-local
      - name: Run malformed-PDF counterexamples inside credential-free image
        run: >-
          docker run --rm --user 12001:12001 --network none --read-only
          --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1
          --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m
          --mount type=bind,src=${{ github.workspace }}/tests/diagnostics,dst=/proof,readonly
          --entrypoint python3 lrv-diagnostic-renderer:20261011 -B /proof/pdf_admission_test.py
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Verify PDF registration, staff browser download, observed locks and populated restore
        run: python3 -B tests/diagnostics/pdf-registration-disposable.py --run-synthetic-local
        env:
          DIAGNOSTICS_RENDERER_MODE: docker
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
          cache: true
      - name: Verify reviewed bookings, observed schedule locks, real browser recovery and populated catalog restore
        run: python3 -B tests/scheduling/disposable.py --run-synthetic-local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-diagnostic-renderer-proof
          path: output/renderer-proof/
          retention-days: 7
